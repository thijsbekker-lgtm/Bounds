name: Repair foundation boot
on:
  push:
    branches: [bounds-v1-foundation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bounds-v1-foundation
      - name: Remove stray history rendering block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="""$('#history').innerHTML=history.length?history.map(roundHistoryItem).join(''): '<div class=\"muted\">Nog geen rondes opgeslagen.</div>';
          """
          candidates=[
            """$('#history').innerHTML=history.length?history.map(roundHistoryItem).join(''): '<div class=\"muted\">Nog geen rondes opgeslagen.</div>';
$$('[data-round]').forEach(b=>b.onclick=()=>openRound(b.dataset.round));
$$('[data-delete-round]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();deleteSavedRound(b.dataset.deleteRound)});
""",
            """$('#history').innerHTML=history.length?history.map(roundHistoryItem).join(''):'<div class=\"muted\">Nog geen rondes opgeslagen.</div>';
$$('[data-round]').forEach(b=>b.onclick=()=>openRound(b.dataset.round));
$$('[data-delete-round]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();deleteSavedRound(b.dataset.deleteRound)});
"""
          ]
          for old in candidates:
              if old in s:
                  p.write_text(s.replace(old,'',1))
                  break
          else:
              raise SystemExit('Stray history block not found')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: remove stray history block from foundation boot" || exit 0
          git push origin HEAD:bounds-v1-foundation
