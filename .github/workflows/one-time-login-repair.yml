name: One-time login repair
on:
  push:
    branches: [bounds-v1-foundation]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bounds-v1-foundation
      - name: Remove top-level history block that prevents app boot
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.js')
          s = p.read_text()
          pattern = r"\n\$\('#history'\)\.innerHTML=history\.length\?history\.map\(roundHistoryItem\)\.join\(''\).*?\n\$\$\('\[data-round\]'\).*?\n\$\$\('\[data-delete-round\]'\).*?\n(?=async function openRound)"
          fixed, count = re.subn(pattern, '\n', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one stray history block, found {count}')
          p.write_text(fixed)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: restore app boot by removing stray history block"
          git push origin HEAD:bounds-v1-foundation
