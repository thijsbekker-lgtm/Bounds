name: Repair login boot on PR
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove stray history rendering block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          candidates=[
            """$('#history').innerHTML=history.length?history.map(roundHistoryItem).join(''): '<div class=\"muted\">Nog geen rondes opgeslagen.</div>';
$$('[data-round]').forEach(b=>b.onclick=()=>openRound(b.dataset.round));
$$('[data-delete-round]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();deleteSavedRound(b.dataset.deleteRound)});
""",
            """$('#history').innerHTML=history.length?history.map(roundHistoryItem).join(''):'<div class=\"muted\">Nog geen rondes opgeslagen.</div>';
$$('[data-round]').forEach(b=>b.onclick=()=>openRound(b.dataset.round));
$$('[data-delete-round]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();deleteSavedRound(b.dataset.deleteRound)});
"""
          ]
          for old in candidates:
              if old in s:
                  p.write_text(s.replace(old,'',1))
                  break
          else:
              raise SystemExit('Stray history block not found')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: remove stray history block" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
