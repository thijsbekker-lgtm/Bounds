name: PR preview artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Prepare preview instructions
        run: |
          cat > BOUNDS-PR-PREVIEW.txt <<'EOF'
BOUNDS PR PREVIEW

This folder is the feature-branch site for PR testing.
It is NOT the live BOUNDS site.

To test locally with Python:
  python -m http.server 8000
Then open:
  http://localhost:8000/

Do not merge this PR until the scorecard and login have been tested.
EOF

      - name: Upload feature-branch site
        uses: actions/upload-artifact@v4
        with:
          name: bounds-scorecard-preview
          path: .
          include-hidden-files: false
          retention-days: 7
          if-no-files-found: error